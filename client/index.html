<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bay Area Shows</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/lib/leaflet/leaflet.css">
    <script type="module" src="/script.js"></script>
</head>
<body>
    <div id="controls">
        <form id="date-filter" autocomplete="off">
            <label for="band-name">Band</label>
            <input id="band-name" name="band" type="text" placeholder="Search by band" />

            <label class="date-controls" for="start-date">Start</label>
            <input class="date-controls" id="start-date" name="start_date" type="date" />

            <label class="date-controls" for="end-date">End</label>
            <input class="date-controls" id="end-date" name="end_date" type="date" />

            <div id="date-presets" class="date-controls">
                <button type="button" class="preset-button" data-preset="today">Today</button>
                <button type="button" class="preset-button" data-preset="tomorrow">Tomorrow</button>
                <button type="button" class="preset-button" data-preset="weekend">This Weekend</button>
            </div>

            <button type="submit">Search</button>
            <button type="button" id="reset-dates">Reset</button>
            <div class="band-nav">
                <button type="button" id="band-prev">Prev show</button>
                <button type="button" id="band-next">Next show</button>
            </div>
            <button type="button" id="list-toggle">Shows</button>
        </form>
    </div>
    <div id="map"></div>

    <div id="list-modal" aria-hidden="true">
        <div class="list-modal__backdrop" data-modal-close></div>
        <div class="list-modal__panel" role="dialog" aria-modal="true" aria-labelledby="list-modal-title">
            <div class="list-modal__header">
                <div class="list-modal__title">
                    <h2 id="list-modal-title">Shows</h2>
                    <span id="list-count" class="list-modal__count"></span>
                </div>
                <button type="button" class="list-modal__close" data-modal-close aria-label="Close list">Close</button>
            </div>
            <div id="list-modal-body" class="list-modal__body"></div>
        </div>
    </div>
</body>
</html>
